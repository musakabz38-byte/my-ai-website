<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY AI - By Musa</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
.head{background:#1e293b;padding:15px;text-align:center}
h1{margin:0;font-size:22px}
#chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.4;word-wrap:break-word}
.user{background:#3b82f6;align-self:flex-end}
.ai{background:#1e293b;border:1px solid #334155;align-self:flex-start}
.bar{padding:15px;background:#1e293b;display:flex;gap:10px}
input{flex:1;padding:14px;border-radius:25px;border:1px solid #334155;background:#0f172a;color:white;outline:none}
button{padding:14px 20px;border-radius:25px;border:none;background:#3b82f6;color:white;font-weight:bold}
</style>
</head>
<body>
<div class="head">
<h1>🤖 MY AI Studio</h1>
<div style="color:#94a3b8;font-size:13px">Built by Musa Kabz</div>
</div>

<div id="chat">
<div class="msg ai">Hello Musa! I'm your AI! Ask me anything 👇</div>
</div>

<div class="bar">
<input id="in" placeholder="Ask me anything...">
<button onclick="go()">Send</button>
</div>

<script>
const BRAIN="https://my-ai-studio.musakabz38.workers.dev";

async function go(){
 const i=document.getElementById('in');
 const c=document.getElementById('chat');
 const t=i.value.trim();
 if(!t)return;
 c.innerHTML+='<div class=msg user>'+t+'</div>';
 i.value='';
 c.scrollTop=c.scrollHeight;
 const id='a'+Date.now();
 c.innerHTML+='<div class="msg ai" id="'+id+'">Thinking...</div>';
 c.scrollTop=c.scrollHeight;
 try{
  const r=await fetch(BRAIN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
  const d=await r.json();
  document.getElementById(id).textContent=d.response;
 }catch(e){
  document.getElementById(id).textContent='Error: '+e.message;
 }
 c.scrollTop=c.scrollHeight;
}
document.getElementById('in').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body>
</html>
